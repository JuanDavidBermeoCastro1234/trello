<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Trello</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tablero Trello</h1>

    <div class="controls">
      <form id="add-status-form">
        <input id="new-status-name" placeholder="Nueva columna (nombre)" />
        <button type="submit">Agregar columna</button>
      </form>

      <form id="add-task-form">
        <input id="new-task-title" placeholder="Título tarea" required />
        <input id="new-task-desc" placeholder="Descripción" />
        <select id="new-task-status" title="new-task-status"></select>
        <button type="submit">Agregar tarea</button>
      </form>
    </div>

    <div class="board" id="board-root"></div>

    <script src="app.js"></script>
  </body>
</html>
